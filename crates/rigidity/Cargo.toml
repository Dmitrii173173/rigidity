[package]
name        = "rigidity"
description = "Point-cloud registration that reports which degrees of freedom the geometry determined. A facade over the rigidity-* crates."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
rigidity-core.workspace = true
rigidity-spatial  = { workspace = true, optional = true }
rigidity-io       = { workspace = true, optional = true }
rigidity-pipeline = { workspace = true, optional = true }
rigidity-scenes   = { workspace = true, optional = true }
rigidity-graph    = { workspace = true, optional = true }

[features]
# The path almost everyone arrives by: a file on disk → a report. Anyone
# who wants the core alone turns default off and does not pay for the
# format parsers.
default  = ["pipeline"]
spatial  = ["dep:rigidity-spatial"]
io       = ["dep:rigidity-io"]
# `rigidity-pipeline` pulls io and spatial in anyway; they are enabled here
# explicitly because a crate may only re-export its own dependency, never a
# transitive one.
pipeline = ["dep:rigidity-pipeline", "io", "spatial"]
scenes   = ["dep:rigidity-scenes"]
graph    = ["dep:rigidity-graph"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
