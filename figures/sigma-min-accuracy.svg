<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<style>
:root { --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#8a8880;
--grid:#e6e5e0; --axis:#c9c7c0; --direct:#2a78d6; --normal:#eb6834; }
@media (prefers-color-scheme: dark) {
:root { --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8a8880;
--grid:#2e2e2b; --axis:#45443f; --direct:#3987e5; --normal:#d95926; }
}
.surface{fill:var(--surface)} .title{fill:var(--ink);font-size:16px;font-weight:600}
.subtitle{fill:var(--ink-2);font-size:12.5px} .tick{fill:var(--ink-2);font-size:11.5px}
.axis-title{fill:var(--ink-2);font-size:12px} .note{fill:var(--ink-3);font-size:11px}
.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--axis);stroke-width:1}
.series{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.marker{stroke:var(--surface);stroke-width:2}
.label{fill:var(--ink);font-size:12px;font-weight:600}
.legend{fill:var(--ink-2);font-size:12px}
.guide{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:4 4;opacity:.75}
</style>
<rect class="surface" x="0" y="0" width="800" height="500"/>
